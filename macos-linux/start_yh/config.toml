[server]
port = 8300
host = "127.0.0.1"
data_dir = "./data"

# Add agents here. Each gets a status pill, @mention routing, and color.
# "cwd" is the working directory for the agent's terminal session.
# "command" is the CLI command (must be on PATH).

[agents.claude]
command = "claude"
cwd = ".."
color = "#da7756"
label = "Claude"

[agents.codex]
command = "codex"
cwd = ".."
color = "#10a37f"
label = "Codex"

[agents.gemini]
command = "gemini"
cwd = ".."
color = "#4285f4"
label = "Gemini"

[agents.kimi]
command = "kimi"
cwd = ".."
color = "#1783ff"
label = "Kimi"

[agents.qwen]
command = "qwen"
cwd = ".."
color = "#8b5cf6"
label = "Qwen"
mcp_inject = "settings_file"
mcp_settings_path = ".qwen/settings.json"
mcp_transport = "http"
inject_delay = 1.0

[agents.kilo]
command = "kilo"
cwd = ".."
color = "#f7f677"
label = "Kilo"

# --- Multi-cwd: -agr=ai-github-repos  -asa=ai_service_agent  -at=agentteam ---
[agents.claude-agr]
command = "claude"
cwd = "/home/dev/ai-github-repos"
color = "#e8a87c"
label = "Claude-AGR"
mcp_inject = "flag"
mcp_flag = "--mcp-config"
mcp_transport = "http"
mcp_merge_project = true

[agents.claude-asa]
command = "claude"
cwd = "/home/dev/ai_service_agent"
color = "#c77dba"
label = "Claude-ASA"
mcp_inject = "flag"
mcp_flag = "--mcp-config"
mcp_transport = "http"
mcp_merge_project = true

[agents.claude-at]
command = "claude"
cwd = "/home/dev/agentteam"
color = "#d4735e"
label = "Claude-AT"
mcp_inject = "flag"
mcp_flag = "--mcp-config"
mcp_transport = "http"
mcp_merge_project = true

[agents.codex-agr]
command = "codex"
cwd = "/home/dev/ai-github-repos"
color = "#4fd1a5"
label = "Codex-AGR"
mcp_inject = "proxy_flag"
mcp_proxy_flag_template = '-c mcp_servers.{server}.url="{url}"'

[agents.codex-asa]
command = "codex"
cwd = "/home/dev/ai_service_agent"
color = "#0e8a6d"
label = "Codex-ASA"
mcp_inject = "proxy_flag"
mcp_proxy_flag_template = '-c mcp_servers.{server}.url="{url}"'

[agents.codex-at]
command = "codex"
cwd = "/home/dev/agentteam"
color = "#2db88a"
label = "Codex-AT"
mcp_inject = "proxy_flag"
mcp_proxy_flag_template = '-c mcp_servers.{server}.url="{url}"'

[agents.gemini-agr]
command = "gemini"
cwd = "/home/dev/ai-github-repos"
color = "#7baaf7"
label = "Gemini-AGR"
mcp_inject = "env"
mcp_env_var = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"
mcp_transport = "http"
mcp_merge_project = true

[agents.gemini-asa]
command = "gemini"
cwd = "/home/dev/ai_service_agent"
color = "#6a9bf5"
label = "Gemini-ASA"
mcp_inject = "env"
mcp_env_var = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"
mcp_transport = "http"
mcp_merge_project = true

[agents.gemini-at]
command = "gemini"
cwd = "/home/dev/agentteam"
color = "#85b3f8"
label = "Gemini-AT"
mcp_inject = "env"
mcp_env_var = "GEMINI_CLI_SYSTEM_SETTINGS_PATH"
mcp_transport = "http"
mcp_merge_project = true

[agents.minimax]
type = "api"
base_url = "https://api.minimax.io/v1"
model = "MiniMax-M2.7"
color = "#2fe898"
label = "MiniMax"
api_key_env = "MINIMAX_API_KEY"
temperature = 1.0

[routing]
# "none" = only route on explicit @mention. "all" = route to all agents by default.
default = "none"
max_agent_hops = 4

[mcp]
http_port = 8200
sse_port = 8201

[images]
upload_dir = "./uploads"
max_size_mb = 10

# --- MCP injection modes ---
# By default, claude/codex/gemini/kimi use built-in MCP config injection.
# For other CLI agents, set mcp_inject to tell the wrapper how to inject auth:
#
# mcp_inject modes:
#   "settings_file" — write a JSON settings file at mcp_settings_path (merges, not overwrites)
#   "env"           — write a settings file, expose path via mcp_env_var
#   "flag"          — write a config file, pass via CLI flag (mcp_flag, default: --mcp-config)
#   "proxy_flag"    — start a local proxy, pass URL via CLI flag template
#
# Example: Qwen Code CLI
#   [agents.qwen]
#   command = "qwen"
#   cwd = ".."
#   color = "#8b5cf6"
#   label = "Qwen"
#   mcp_inject = "settings_file"
#   mcp_settings_path = ".qwen/settings.json"
#   mcp_transport = "http"
#
# Example: CLI with env var for settings
#   [agents.mycli]
#   command = "mycli"
#   mcp_inject = "env"
#   mcp_env_var = "MYCLI_MCP_SETTINGS"
#   mcp_transport = "http"

# --- API agents (local models) ---
# Add local model agents in config.local.toml (gitignored).
# Example config.local.toml:
#
#   [agents.qwen]
#   type = "api"
#   base_url = "http://localhost:8189/v1"
#   model = "qwen3-4b"
#   color = "#8b5cf6"
#   label = "Qwen"
#   # api_key_env = "MY_API_KEY"     # optional: env var name for API key
#   # system_prompt = "You are ..."   # optional: custom system prompt
#
# Then run: python wrapper_api.py qwen
